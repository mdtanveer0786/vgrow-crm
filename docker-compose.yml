version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=/api
    networks:
      - vgrow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=mysql://root:root2!@db:3306/vgrow
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-fallback_secret_for_local_dev}
      - CLIENT_URL=http://localhost
    depends_on:
      - db
      - redis
    networks:
      - vgrow-network

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root2!
      - MYSQL_DATABASE=vgrow
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - vgrow-network

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - vgrow-network

networks:
  vgrow-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data:

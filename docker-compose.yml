version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: vgrow_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vgrow_crm
      MYSQL_USER: vgrow_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: vgrow_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: vgrow_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=mysql://vgrow_user:password@db:3306/vgrow_crm
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:80
      - JWT_SECRET=super_secret_jwt_key
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: vgrow_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:

name: vGrow CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    # We set up a real MySQL and Redis service for integration testing
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: vgrow_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      working-directory: ./backend

    - name: Generate Prisma Client
      run: npx prisma generate
      working-directory: ./backend

    - name: Push DB Schema
      env:
        DATABASE_URL: mysql://root:root@127.0.0.1:3306/vgrow_test
      run: npx prisma db push
      working-directory: ./backend

    - name: Run Backend Tests
      env:
        NODE_ENV: test
        PORT: 5000
        DATABASE_URL: mysql://root:root@127.0.0.1:3306/vgrow_test
        REDIS_URL: redis://127.0.0.1:6379
        JWT_SECRET: testing_secret
      run: npm run test
      working-directory: ./backend

  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js 20.x
      uses: actions/setup-node@v3
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: npm ci
      working-directory: ./frontend

    - name: Run Build (Dry Run for UI verification)
      run: npm run build
      working-directory: ./frontend
